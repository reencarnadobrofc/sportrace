<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sport Race Calculator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #090708;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      background: #0f0905;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      padding: 30px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .title {
      font-size: 2.5rem;
      color: #ff5d5d;
      text-shadow: 0 0 18px rgba(255,0,0,.8);
    }

    .btn-clear {
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      background: #ff5d5d;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 24px;
      padding: 24px;
    }

    .section-title {
      margin-bottom: 18px;
      font-size: 1.4rem;
      color: #ff4a4a;
      border-bottom: 1px solid rgba(255,74,74,.35);
      padding-bottom: 10px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .row label {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      font-size: 1rem;
    }

    .row select,
    .row button,
    .row input[type='checkbox'] {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
    }

    .row select {
      background: white;
      color: black;
      padding: 10px 14px;
      min-width: 150px;
    }

    .row option {
      color: black;
      background: white;
    }

    .row button {
      min-width: 34px;
      min-height: 34px;
      background: rgba(255,255,255,.08);
      color: white;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .row .value {
      min-width: 110px;
      text-align: right;
      font-weight: 700;
      color: white;
    }

    .total-box {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.12);
      text-align: right;
    }

    .total-label {
      color: #b3b3b3;
      margin-bottom: 8px;
    }

    .total-value {
      font-size: 2rem;
      font-weight: 800;
      color: white;
    }

    .note {
      margin-top: 16px;
      color: #7edbff;
      font-size: .95rem;
    }

    .footer {
      margin-top: 20px;
      color: #b3b3b3;
      font-size: 0.95rem;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="title">Sport Race Calculator</div>
      <button class="btn-clear" id="clearBtn">Limpar tudo</button>
    </div>

    <div class="grid">
      <div class="card">
        <div class="section-title">MELHORIAS</div>
        <div id="melhorias"></div>
        <div class="section-title" style="margin-top: 26px;">MELHORIAS FULL</div>
        <div id="full"></div>
        <div class="note">OBS: TURBO não é do Full Tuning.</div>
      </div>

      <div class="card">
        <div class="section-title">ESTÉTICA</div>
        <div id="estetica"></div>
        <div class="section-title" style="margin-top: 26px;">EXTRAS</div>
        <div id="extras"></div>
      </div>

      <div class="card">
        <div class="section-title">SERVIÇOS</div>
        <div id="servicos"></div>
        <div class="section-title" style="margin-top: 26px;">VENDAS</div>
        <div id="vendas"></div>
      </div>
    </div>

    <div class="total-box">
      <div class="total-label">Total selecionado</div>
      <div class="total-value" id="totalValue">R$ 0,00</div>
    </div>

    <div class="footer">
      Última atualização: <span id="lastUpdate">carregando...</span>
    </div>
  </div>

  <script>
    const money = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

    const sections = [
      { title: 'MELHORIAS', items: ['Motor', 'Freio', 'Transmissão', 'Suspensão', 'Blindagem'] }
    ];

    const estetica = [
      ['Rodas', 4200],
      ['Cor das Rodas', 1400],
      ['Cor da Fumaça', 2160],
      ['Insulfilm', 1440],
      ['Placa', 3000],
      ['Buzina', 1800],
      ['Neon', 1440],
      ['Cor do Neon', 1440],
      ['Xenon', 1440],
      ['Cor do Xenon', 1440],
      ['Pintura Camaleão', 2500],
      ['Pinturas Spray', 1920],
      ['Não listados', 1800]
    ];

    const servicos = [
      ['Atendimento no Sul', 700],
      ['Atendimento no Norte', 1200],
      ['Reparo Carro', 1200],
      ['Repor Pneu', 900],
      ['Rastreador', 15600],
      ['Kit Drift', 15600],
      ['Nitro', 9600]
    ];

    const vendas = [
      ['Reparo', 1200],
      ['Pneu', 900],
      ['Chave de Roda', 960]
    ];

    const extras = [
      ['Ajuste de Roda', 4200],
      ['Suspensão a Ar', 5200],
      ['Extras', 1800]
    ];

    const state = {
      selected: {},
      quantities: {},
      selectValues: {}
    };

    const selectElements = {};
    const checkboxElements = {};

    const totalValue = document.getElementById('totalValue');
    const clearBtn = document.getElementById('clearBtn');

    const applyFullTuning = (name, checked) => {
      const tuningValues = {
        Motor: 'Nível 4 - $ 17.400',
        Freio: 'Nível 3 - $ 11.760',
        Transmissão: 'Nível 3 - $ 13.800',
        Suspensão: 'Nível 4 - $ 17.400'
      };

      if (name === 'Full Tuning' && checked) {
        state.selected['Full Tuning + Blindagem'] = false;
        if (checkboxElements['Full Tuning + Blindagem']) checkboxElements['Full Tuning + Blindagem'].checked = false;
        Object.entries(tuningValues).forEach(([item, value]) => {
          state.selectValues[item] = value;
          if (selectElements[item]) selectElements[item].value = value;
        });
      }

      if (name === 'Full Tuning + Blindagem' && checked) {
        state.selected['Full Tuning'] = false;
        if (checkboxElements['Full Tuning']) checkboxElements['Full Tuning'].checked = false;
        Object.entries(tuningValues).forEach(([item, value]) => {
          state.selectValues[item] = value;
          if (selectElements[item]) selectElements[item].value = value;
        });
        const blindagemValue = 'Nível 5 - $ 32.400';
        state.selectValues.Blindagem = blindagemValue;
        if (selectElements.Blindagem) selectElements.Blindagem.value = blindagemValue;
      }

      if (!checked && name === 'Full Tuning') {
        Object.entries(tuningValues).forEach(([item, value]) => {
          if (state.selectValues[item] === value) {
            state.selectValues[item] = 'Nenhum';
            if (selectElements[item]) selectElements[item].value = 'Nenhum';
          }
        });
      }

      if (!checked && name === 'Full Tuning + Blindagem') {
        Object.entries(tuningValues).forEach(([item, value]) => {
          if (state.selectValues[item] === value) {
            state.selectValues[item] = 'Nenhum';
            if (selectElements[item]) selectElements[item].value = 'Nenhum';
          }
        });
        if (state.selectValues.Blindagem === 'Nível 5 - $ 32.400') {
          state.selectValues.Blindagem = 'Nenhum';
          if (selectElements.Blindagem) selectElements.Blindagem.value = 'Nenhum';
        }
      }
    };

    const renderRow = ({ name, value, type, selectOptions }) => {
      const row = document.createElement('div');
      row.className = 'row';

      const label = document.createElement('label');
      label.textContent = name;
      label.style.flex = '1';

      if (type === 'select') {
        const select = document.createElement('select');
        select.innerHTML = `<option value="Nenhum">Nenhum</option>` + selectOptions.map((option) => `<option value="${option}">${option}</option>`).join('');
        select.value = state.selectValues[name] || 'Nenhum';
        select.addEventListener('change', (e) => {
          state.selectValues[name] = e.target.value;
          updateTotal();
        });
        selectElements[name] = select;
        row.append(label, select);
      } else if (type === 'checkbox') {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.checked = !!state.selected[name];
        input.addEventListener('change', () => {
          state.selected[name] = !state.selected[name];
          applyFullTuning(name, state.selected[name]);
          updateTotal();
        });
        checkboxElements[name] = input;
        const valueSpan = document.createElement('span');
        valueSpan.className = 'value';
        valueSpan.textContent = money(value);
        row.append(input, label, valueSpan);
      } else if (type === 'quantity') {
        const valueSpan = document.createElement('span');
        valueSpan.textContent = state.quantities[name] || 0;
        valueSpan.style.minWidth = '24px';
        valueSpan.style.textAlign = 'center';

        const minus = document.createElement('button');
        minus.type = 'button';
        minus.textContent = '-';
        minus.addEventListener('click', () => {
          state.quantities[name] = Math.max(0, (state.quantities[name] || 0) - 1);
          valueSpan.textContent = state.quantities[name];
          updateTotal();
        });

        const plus = document.createElement('button');
        plus.type = 'button';
        plus.textContent = '+';
        plus.addEventListener('click', () => {
          state.quantities[name] = (state.quantities[name] || 0) + 1;
          valueSpan.textContent = state.quantities[name];
          updateTotal();
        });

        const controls = document.createElement('div');
        controls.style.display = 'flex';
        controls.style.alignItems = 'center';
        controls.style.gap = '8px';
        controls.append(minus, valueSpan, plus);

        row.append(label, controls);
      }

      return row;
    };

    const updateTotal = () => {
      let total = 0;

      sections[0].items.forEach((item) => {
        const selectedValue = state.selectValues[item];
        if (selectedValue && selectedValue !== 'Nenhum') {
          const match = selectedValue.match(/\$ ([\d.]+)/);
          if (match) total += Number(match[1].replace(/\./g, ''));
        }
      });

      [['Turbo', 7800]].forEach(([name, value]) => {
        if (state.selected[name]) total += value;
      });

      [...estetica, ...extras].forEach(([name, value]) => {
        if (state.selected[name]) total += value;
      });

      servicos.forEach(([name, value]) => {
        total += (state.quantities[name] || 0) * value;
      });

      vendas.forEach(([name, value]) => {
        total += (state.quantities[name] || 0) * value;
      });

      totalValue.textContent = money(total);
    };

    const renderList = (containerId, items, type, selectOptions = []) => {
      const container = document.getElementById(containerId);
      items.forEach((item) => {
        const [name, value] = item;
        const row = renderRow({ name, value, type, selectOptions: name === 'Blindagem' ? [
          'Nível 1 - $ 13.200',
          'Nível 2 - $ 15.000',
          'Nível 3 - $ 19.800',
          'Nível 4 - $ 25.800',
          'Nível 5 - $ 32.400'
        ] : selectOptions });
        container.appendChild(row);
      });
    };

    document.addEventListener('DOMContentLoaded', () => {
      const melhoriasContainer = document.getElementById('melhorias');
      sections[0].items.forEach((name) => {
        const options = name === 'Blindagem' ? [
          'Nível 1 - $ 13.200',
          'Nível 2 - $ 15.000',
          'Nível 3 - $ 19.800',
          'Nível 4 - $ 25.800',
          'Nível 5 - $ 32.400'
        ] : [
          'Nível 1 - $ 9.000',
          'Nível 2 - $ 11.760',
          'Nível 3 - $ 13.800',
          'Nível 4 - $ 17.400',
          'Nível 5 - $ 22.200'
        ];
        melhoriasContainer.appendChild(renderRow({ name, value: 0, type: 'select', selectOptions: options }));
      });

      ['Turbo', 'Full Tuning', 'Full Tuning + Blindagem'].forEach((name, index) => {
        const values = [7800, 62400, 94800];
        document.getElementById('full').appendChild(renderRow({ name, value: values[index], type: 'checkbox' }));
      });

      estetica.forEach(([name, value]) => document.getElementById('estetica').appendChild(renderRow({ name, value, type: 'checkbox' })));
      extras.forEach(([name, value]) => document.getElementById('extras').appendChild(renderRow({ name, value, type: 'checkbox' })));
      servicos.forEach(([name, value]) => document.getElementById('servicos').appendChild(renderRow({ name, value, type: 'quantity' })));
      vendas.forEach(([name, value]) => document.getElementById('vendas').appendChild(renderRow({ name, value, type: 'quantity' })));

      clearBtn.addEventListener('click', () => {
        window.location.reload();
      });

      const lastUpdate = document.getElementById('lastUpdate');
      const now = new Date();
      lastUpdate.textContent = now.toLocaleString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      updateTotal();
    });
  </script>
</body>
</html>
